name: Installation and offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  install:
    name: Install (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python scripts/smoke_install.py
      - run: python scripts/doctor.py
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: python scripts/run_tests.py --ui
      - run: python scripts/check_docs.py
      - run: python scripts/check_privacy.py --tracked
